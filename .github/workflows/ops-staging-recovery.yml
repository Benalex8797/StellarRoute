name: Ops Staging Recovery

# TEMPORARY: remove after staging recovery is complete.
# Reboots the staging instance and runs a minimal SSM diagnostic.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-staging-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Reboot staging EC2 and diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Attempt instance reboot
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          STAGING_INSTANCE_ID: ${{ secrets.STAGING_INSTANCE_ID }}
        run: |
          set -uo pipefail
          echo "Attempting reboot of ${STAGING_INSTANCE_ID}..."
          if aws ec2 reboot-instances --region "${AWS_REGION}" --instance-ids "${STAGING_INSTANCE_ID}"; then
            echo "REBOOT_OK=1" >> "${GITHUB_ENV}"
            echo "Reboot requested. Waiting 120s for boot + SSM agent..."
            sleep 120
          else
            echo "REBOOT_OK=0" >> "${GITHUB_ENV}"
            echo "Reboot denied or failed (likely IAM). Continuing to SSM diagnostic anyway."
          fi

      - name: SSM diagnostic
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          STAGING_INSTANCE_ID: ${{ secrets.STAGING_INSTANCE_ID }}
        run: |
          set -euo pipefail

          jq -n '{
            commands: [
              "echo DIAG_BEGIN; date -u; uptime; echo; df -h / /var; echo; free -m; echo; docker ps -a --format \"table {{.Names}}\t{{.Status}}\" || true; echo; journalctl -u amazon-ssm-agent -n 20 --no-pager 2>/dev/null || snap logs amazon-ssm-agent -n 20 2>/dev/null || true; echo DIAG_END"
            ]
          }' > /tmp/ssm-diag.json

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${STAGING_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Staging recovery diagnostic" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-diag.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "Started SSM diagnostic: ${COMMAND_ID}"

          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${STAGING_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"
            case "${STATUS}" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "Final SSM status: ${STATUS}"
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${STAGING_INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json
